[platformio]
default_envs = nodemcu-32s2

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nodemcu-32s2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:nodemcu-32s2]
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DTFT_BL=7
    -DTFT_MISO=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000

[env:nodemcu-32s2-adafruit]
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit GC9A01A@^1.1.1